schema-version: 1.0

description: Turn the XBee LFS root filesystem into a bootable BIOS QCOW2 image.

require: ../build-system

builder:
  - origin: ../rootfs
    alias: rootfs

var:
  xbee:
    version: "13.0"
  image:
    name: xbee-lfs-13.0-x86_64
    extra-size-mib: 2048

provision:
  - shell:
      cmd:
        - apt-get update
        - >-
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          e2fsprogs grub-pc-bin mount parted qemu-utils tar zstd

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/build-image.sh"
          "/opt/xbee-lfs/rootfs.tar.zst"
          "{{ .image.name }}"
          "{{ .image.extra-size-mib }}"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
