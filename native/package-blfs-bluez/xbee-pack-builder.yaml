schema-version: 1.0
description: Build bluez 5.86 for the BLFS Bluetooth stack.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-dbus, alias: dbus }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-libical, alias: blfs-libical }]
var: { xbee: { version: "5.86-2" }, lfs: { jobs: 4 }, package: { name: bluez, version: "5.86", source: bluez-5.86.tar.xz, runtime-dependencies: "dbus,glib,libical" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
