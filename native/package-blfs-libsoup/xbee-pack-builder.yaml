var: { xbee: { version: "3.6.6-3" }, lfs: { jobs: 4 }, package: { name: libsoup, version: "3.6.6", source: libsoup-3.6.6.tar.xz, runtime-dependencies: "glib,glib-gir,gobject-introspection,libpsl,libidn2,libunistring,nghttp2,sqlite,glib-networking,gnutls,nettle,libtasn1,p11-kit,gsettings-desktop-schemas,make-ca" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
