schema-version: 1.0
description: Build Speex and SpeexDSP 1.2.1 speech codecs.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-libogg, alias: blfs-libogg }]
var: { xbee: { version: "1.2.1-1" }, lfs: { jobs: 4 }, package: { name: speex, version: "1.2.1", source: speex-1.2.1.tar.gz, runtime-dependencies: libogg } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
