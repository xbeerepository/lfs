schema-version: 1.0
description: Build libcloudproviders 0.3.6 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-glib-gir, alias: blfs-glib-gir }, { origin: ../package-blfs-gtk3, alias: blfs-gtk3 }, { origin: ../package-blfs-gobject-introspection, alias: blfs-gobject-introspection }]
