schema-version: 1.0

description: Publish the BIOS and UEFI package-assembled LFS images.

require: ../../build-system

builder:
  - origin: ../package-system
    alias: bios
  - origin: ../package-uefi-system
    alias: uefi

bind:
  release-signing-key:
    from: ${HOME}/.xbee/.ssh/xbee-lfs-release-ed25519.pem
    to: /run/xbee-secrets/release-signing-key.pem:ro

var:
  xbee:
    version: "0.3.2"
  release:
    name: xbee-lfs-native-13.0-x86_64-packages

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/build-package-release-system.sh"
          "/opt/xbee-lfs-native/xbee-lfs-native-13.0-x86_64-packages.qcow2"
          "/opt/xbee-lfs-native/package-system-metadata.yaml"
          "/opt/xbee-lfs-native/xbee-lfs-native-13.0-x86_64-packages-uefi.qcow2"
          "/opt/xbee-lfs-native/package-uefi-system-metadata.yaml"
          "{{ .release.name }}"
          "/run/xbee-secrets/release-signing-key.pem"
          "{{ .xbee.resources }}"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
