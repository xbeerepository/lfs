schema-version: 1.0

description: Build the XML::Parser package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-perl
    alias: perl
  - origin: ../package-expat
    alias: expat

var:
  xbee:
    version: "2.47-2"
  lfs:
    jobs: 4
  package:
    name: xml-parser
    version: "2.47"
    source: XML-Parser-2.47.tar.gz
    runtime-dependencies: perl,expat

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
