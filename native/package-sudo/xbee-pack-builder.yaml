schema-version: 1.0

description: Build the sudo package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-libxcrypt
    alias: libxcrypt
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-openssl
    alias: openssl

var:
  xbee:
    version: "1.9.17p2"
  lfs:
    jobs: 4
  package:
    name: sudo
    version: "1.9.17p2"
    source: sudo-1.9.17p2.tar.gz
    runtime-dependencies: libxcrypt,zlib,openssl

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
