schema-version: 1.0

description: Bootable minimal XBee OS 13.0 system for VirtualBox.

system:
  builder:
    origin: ../xbee-os-virtualbox-rootfs
    alias: rootfs
  user: xbee

var:
  xbee:
    version: "13.0-virtualbox"
    user: xbee
    group: xbee
    app: /workspace

user: xbee
directory: /workspace

provider:
  virtualbox:
    disk: https://github.com/xbeerepository/lfs/releases/download/v0.3.0/xbee-os-13.0-x86_64-virtualbox.vmdk
    ostype: Linux_64
    guest-additions: false
    cloud-init: ""
