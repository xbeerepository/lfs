schema-version: 1.0

description: Build gdk-pixbuf from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-shared-mime-info
    alias: blfs-shared-mime-info
  - origin: ../package-blfs-libjpeg-turbo
    alias: blfs-libjpeg-turbo
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-giflib
    alias: blfs-giflib
  - origin: ../package-blfs-libtiff
    alias: blfs-libtiff
  - origin: ../package-blfs-glib
    alias: blfs-glib
  - origin: ../package-blfs-gobject-introspection
    alias: blfs-gobject-introspection
  - origin: ../package-blfs-glib-gir
    alias: blfs-glib-gir
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-util-linux
    alias: util-linux
  - origin: ../package-readline
    alias: readline
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-xz
    alias: xz
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "2.44.5-5"
  lfs:
    jobs: 4
  package:
    name: gdk-pixbuf
    version: "2.44.5"
    source: gdk-pixbuf-2.44.5.tar.xz
    runtime-dependencies: glib,gobject-introspection,glib-gir,shared-mime-info,libjpeg-turbo,libpng,giflib,libtiff

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
