schema-version: 1.0

description: Build the Util-linux package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-ncurses
    alias: ncurses
  - origin: ../package-readline
    alias: readline
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-libcap
    alias: libcap
  - origin: ../package-file
    alias: file
  - origin: ../package-libxcrypt
    alias: libxcrypt

var:
  xbee:
    version: "2.41.3"
  lfs:
    jobs: 4
  package:
    name: util-linux
    version: "2.41.3"
    source: util-linux-2.41.3.tar.xz
    runtime-dependencies: ncurses,readline,zlib,libcap,file,libxcrypt

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
