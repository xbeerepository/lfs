schema-version: 1.0
description: Build libqrencode 4.1.1 for KDE Frameworks 6.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-autoconf, alias: autoconf }, { origin: ../package-automake, alias: automake }, { origin: ../package-libtool, alias: libtool }, { origin: ../package-blfs-libpng, alias: blfs-libpng }]
var: { xbee: { version: "4.1.1-1" }, lfs: { jobs: 4 }, package: { name: libqrencode, version: "4.1.1", source: libqrencode-4.1.1.tar.gz, runtime-dependencies: "libpng" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
