schema-version: 1.0

description: Build FreeType from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2

var:
  xbee:
    version: "2.14.1"
  lfs:
    jobs: 4
  package:
    name: freetype
    version: "2.14.1"
    source: freetype-2.14.1.tar.xz
    runtime-dependencies: libpng,brotli,zlib,bzip2

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
