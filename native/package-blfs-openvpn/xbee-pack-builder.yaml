schema-version: 1.0
description: Build openvpn 2.6.14.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-openssl, alias: openssl }, { origin: ../package-blfs-libcap-ng, alias: blfs-libcap-ng }, { origin: ../package-blfs-linux-pam, alias: blfs-linux-pam }]
var: { xbee: { version: "2.6.14-3" }, lfs: { jobs: 4 }, package: { name: openvpn, version: "2.6.14", source: openvpn-2.6.14.tar.gz, runtime-dependencies: "openssl,libcap-ng,linux-pam" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
