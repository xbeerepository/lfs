schema-version: 1.0
description: Build pciutils 3.14.0 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-hwdata, alias: blfs-hwdata }]
var: { xbee: { version: "3.14.0-1" }, lfs: { jobs: 4 }, package: { name: pciutils, version: "3.14.0", source: pciutils-3.14.0.tar.gz, runtime-dependencies: "hwdata" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
