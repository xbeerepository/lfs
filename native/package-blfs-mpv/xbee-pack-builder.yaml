    name: mpv
    version: "0.41.0"
    source: mpv-0.41.0.tar.gz
    runtime-dependencies: alsa-lib,ffmpeg,libass,fontconfig,harfbuzz,fribidi,freetype,libpng,brotli,glib,graphite2,expat,libplacebo,libvpx,mesa,pulseaudio,libjpeg-turbo,libva,libdvdcss,libdvdread,libdvdnav,pipewire,sdl2-compat,wayland,wayland-protocols,libdrm,libdisplay-info,libxkbcommon,libxml2,icu,zlib,xz
