schema-version: 1.0
description: Build samba 4.23.5 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-krb5, alias: blfs-krb5 }, { origin: ../package-blfs-cyrus-sasl, alias: blfs-cyrus-sasl }, { origin: ../package-blfs-openldap, alias: blfs-openldap }, { origin: ../package-blfs-talloc, alias: blfs-talloc }, { origin: ../package-blfs-gnutls, alias: blfs-gnutls }, { origin: ../package-blfs-nettle, alias: blfs-nettle }, { origin: ../package-blfs-libtasn1, alias: blfs-libtasn1 }, { origin: ../package-blfs-p11-kit, alias: blfs-p11-kit }, { origin: ../package-blfs-libunistring, alias: blfs-libunistring }, { origin: ../package-blfs-linux-pam, alias: blfs-linux-pam }, { origin: ../package-blfs-libarchive, alias: blfs-libarchive }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }, { origin: ../package-blfs-libtirpc, alias: blfs-libtirpc }, { origin: ../package-python, alias: python }, { origin: ../package-blfs-perl-parse-yapp, alias: blfs-perl-parse-yapp }]
var: { xbee: { version: "4.23.5-4" }, lfs: { jobs: 4 }, package: { name: samba, version: "4.23.5", source: samba-4.23.5.tar.gz, runtime-dependencies: "krb5,cyrus-sasl,openldap,talloc,gnutls,linux-pam,libarchive,libtirpc,python" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
