schema-version: 1.0

description: Build the tllist 1.1.0 typed linked-list header for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja

var:
  xbee:
    version: "1.1.0-2"
  lfs:
    jobs: 4
  package:
    name: tllist
    version: "1.1.0"
    source: tllist_1.1.0.orig.tar.gz
    runtime-dependencies: ""

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
