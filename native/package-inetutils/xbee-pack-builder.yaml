schema-version: 1.0

description: Build the inetutils package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-ncurses
    alias: ncurses
  - origin: ../package-readline
    alias: readline
  - origin: ../package-libxcrypt
    alias: libxcrypt

var:
  xbee:
    version: "2.7"
  lfs:
    jobs: 4
  package:
    name: inetutils
    version: "2.7"
    source: inetutils-2.7.tar.gz
    runtime-dependencies: ncurses,readline,libxcrypt

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
