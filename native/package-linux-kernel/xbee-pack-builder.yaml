schema-version: 1.0

description: Build the Linux kernel image package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-linux-headers
    alias: linux-headers

var:
  xbee:
    version: "6.18.10"
  lfs:
    jobs: 4
    config_revision: 5
  package:
    name: linux-kernel
    version: "6.18.10"
    source: linux-6.18.10.tar.xz
    runtime-dependencies: linux-headers

build:
  - shell:
      cmd:
        - >-
          XBEE_KERNEL_REVISION="{{ .lfs.config_revision }}"
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
