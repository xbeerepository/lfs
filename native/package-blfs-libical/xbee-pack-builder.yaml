schema-version: 1.0
description: Build libical 3.0.20 for KDE Frameworks 6.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-cmake, alias: blfs-cmake }, { origin: ../package-blfs-libarchive, alias: blfs-libarchive }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }]
var: { xbee: { version: "3.0.20-4" }, lfs: { jobs: 4 }, package: { name: libical, version: "3.0.20", source: libical-3.0.20.tar.gz, runtime-dependencies: "glib,libxml2,libarchive" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
