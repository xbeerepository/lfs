schema-version: 1.0
description: Build NetworkManager 1.58.0 for the systemd desktop.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-icon-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-blfs-libndp, alias: blfs-libndp }
  - { origin: ../package-blfs-wpa-supplicant, alias: blfs-wpa-supplicant }
  - { origin: ../package-blfs-glib, alias: blfs-glib }
  - { origin: ../package-blfs-polkit, alias: blfs-polkit }
  - { origin: ../package-blfs-libpsl, alias: blfs-libpsl }
  - { origin: ../package-blfs-libidn2, alias: blfs-libidn2 }
  - { origin: ../package-blfs-libunistring, alias: blfs-libunistring }
  - { origin: ../package-systemd, alias: systemd }
  - { origin: ../package-dbus, alias: dbus }
  - { origin: ../package-dhcpcd, alias: dhcpcd }
  - { origin: ../package-libffi, alias: libffi }
  - { origin: ../package-pcre2, alias: pcre2 }
  - { origin: ../package-util-linux, alias: util-linux }
  - { origin: ../package-libcap, alias: libcap }
  - { origin: ../package-expat, alias: expat }
  - { origin: ../package-zlib, alias: zlib }
  - { origin: ../package-xz, alias: xz }
  - { origin: ../package-zstd, alias: zstd }
  - { origin: ../package-meson, alias: meson }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-pkgconf, alias: pkgconf }
var:
  xbee: { version: "1.58.0-5" }
  lfs: { jobs: 4 }
  package:
    name: networkmanager
    version: "1.58.0"
    source: NetworkManager-1.58.0.tar.xz
    runtime-dependencies: libndp,glib,polkit,libpsl,systemd,dbus,wpa-supplicant
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}"
          "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}"
          "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
