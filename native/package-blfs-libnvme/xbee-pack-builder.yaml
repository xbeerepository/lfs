schema-version: 1.0
description: Build libnvme 1.16.1 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-json-c, alias: blfs-json-c }, { origin: ../package-blfs-keyutils, alias: blfs-keyutils }]
var: { xbee: { version: "1.16.1-1" }, lfs: { jobs: 4 }, package: { name: libnvme, version: "1.16.1", source: libnvme-1.16.1.tar.gz, runtime-dependencies: "json-c,keyutils" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
