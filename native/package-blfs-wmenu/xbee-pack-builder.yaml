schema-version: 1.0

description: Build the wmenu 0.2.0 native Wayland launcher for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-wayland
    alias: blfs-wayland
  - origin: ../package-blfs-wayland-protocols
    alias: blfs-wayland-protocols
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-blfs-libxkbcommon
    alias: blfs-libxkbcommon
  - origin: ../package-blfs-cairo
    alias: blfs-cairo
  - origin: ../package-blfs-pango
    alias: blfs-pango
  - origin: ../package-blfs-fribidi
    alias: blfs-fribidi
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-fontconfig
    alias: blfs-fontconfig
  - origin: ../package-blfs-freetype
    alias: blfs-freetype
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-blfs-harfbuzz
    alias: blfs-harfbuzz
  - origin: ../package-blfs-graphite2
    alias: blfs-graphite2
  - origin: ../package-blfs-icu
    alias: blfs-icu
  - origin: ../package-blfs-glib
    alias: blfs-glib
  - origin: ../package-blfs-pixman
    alias: blfs-pixman
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-expat
    alias: expat
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "0.2.0-2"
  lfs:
    jobs: 4
  package:
    name: wmenu
    version: "0.2.0"
    source: wmenu_0.2.0.orig.tar.xz
    runtime-dependencies: wayland,wayland-protocols,libxml2,libxkbcommon,cairo,pango

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
