schema-version: 1.0

description: Build libxslt from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-pkgconf
    alias: pkgconf
  - origin: ../package-zlib
    alias: zlib

var:
  xbee:
    version: "1.1.45-3"
  lfs:
    jobs: 4
  package:
    name: libxslt
    version: "1.1.45"
    source: libxslt-1.1.45.tar.xz
    runtime-dependencies: libxml2,zlib

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
