schema-version: 1.0

description: Build the curl package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-ca-certificates
    alias: ca-certificates
  - origin: ../package-blfs-nghttp2
    alias: blfs-nghttp2
  - origin: ../package-blfs-c-ares
    alias: blfs-c-ares
  - origin: ../package-blfs-libunistring
    alias: blfs-libunistring
  - origin: ../package-blfs-libidn2
    alias: blfs-libidn2
  - origin: ../package-blfs-libpsl
    alias: blfs-libpsl
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-blfs-libssh2
    alias: blfs-libssh2
  - origin: ../package-zstd
    alias: zstd

var:
  xbee:
    version: "8.21.0-4"
  lfs:
    jobs: 4
  package:
    name: curl
    version: "8.21.0"
    source: curl-8.21.0.tar.xz
    runtime-dependencies: openssl,zlib,ca-certificates,nghttp2,c-ares,libunistring,libidn2,libpsl,brotli,libssh2,zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
