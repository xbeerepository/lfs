schema-version: 1.0
description: Build Waybar 0.15.0 for the native Sway desktop.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-blfs-gtkmm, alias: blfs-gtkmm }
  - { origin: ../package-blfs-gtk-layer-shell, alias: blfs-gtk-layer-shell }
  - { origin: ../package-blfs-fmt, alias: blfs-fmt }
  - { origin: ../package-blfs-spdlog, alias: blfs-spdlog }
  - { origin: ../package-blfs-jsoncpp, alias: blfs-jsoncpp }
  - { origin: ../package-blfs-libinput, alias: blfs-libinput }
  - { origin: ../package-blfs-libevdev, alias: blfs-libevdev }
  - { origin: ../package-blfs-libnl, alias: blfs-libnl }
  - { origin: ../package-blfs-pulseaudio, alias: blfs-pulseaudio }
  - { origin: ../package-blfs-libsndfile, alias: blfs-libsndfile }
  - { origin: ../package-blfs-pipewire, alias: blfs-pipewire }
  - { origin: ../package-blfs-wireplumber, alias: blfs-wireplumber }
  - { origin: ../package-blfs-mtdev, alias: blfs-mtdev }
  - { origin: ../package-systemd, alias: systemd }
  - { origin: ../package-blfs-gtk3, alias: blfs-gtk3 }
  - { origin: ../package-blfs-atkmm, alias: blfs-atkmm }
  - { origin: ../package-blfs-pangomm, alias: blfs-pangomm }
  - { origin: ../package-blfs-cairomm, alias: blfs-cairomm }
  - { origin: ../package-blfs-glibmm, alias: blfs-glibmm }
  - { origin: ../package-blfs-libsigcxx, alias: blfs-libsigcxx }
  - { origin: ../package-blfs-at-spi2-core, alias: blfs-at-spi2-core }
  - { origin: ../package-blfs-libepoxy, alias: blfs-libepoxy }
  - { origin: ../package-blfs-mesa, alias: blfs-mesa }
  - { origin: ../package-blfs-glib, alias: blfs-glib }
  - { origin: ../package-blfs-cairo, alias: blfs-cairo }
  - { origin: ../package-blfs-pango, alias: blfs-pango }
  - { origin: ../package-blfs-fribidi, alias: blfs-fribidi }
  - { origin: ../package-blfs-gdk-pixbuf, alias: blfs-gdk-pixbuf }
  - { origin: ../package-blfs-shared-mime-info, alias: blfs-shared-mime-info }
  - { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }
  - { origin: ../package-blfs-giflib, alias: blfs-giflib }
  - { origin: ../package-blfs-libtiff, alias: blfs-libtiff }
  - { origin: ../package-blfs-harfbuzz, alias: blfs-harfbuzz }
  - { origin: ../package-blfs-libxkbcommon, alias: blfs-libxkbcommon }
  - { origin: ../package-blfs-xkeyboard-config, alias: blfs-xkeyboard-config }
  - { origin: ../package-blfs-wayland, alias: blfs-wayland }
  - { origin: ../package-blfs-wayland-protocols, alias: blfs-wayland-protocols }
  - { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }
  - { origin: ../package-blfs-pixman, alias: blfs-pixman }
  - { origin: ../package-blfs-fontconfig, alias: blfs-fontconfig }
  - { origin: ../package-blfs-freetype, alias: blfs-freetype }
  - { origin: ../package-blfs-libpng, alias: blfs-libpng }
  - { origin: ../package-blfs-brotli, alias: blfs-brotli }
  - { origin: ../package-blfs-graphite2, alias: blfs-graphite2 }
  - { origin: ../package-blfs-icu, alias: blfs-icu }
  - { origin: ../package-libffi, alias: libffi }
  - { origin: ../package-pcre2, alias: pcre2 }
  - { origin: ../package-util-linux, alias: util-linux }
  - { origin: ../package-readline, alias: readline }
  - { origin: ../package-zlib, alias: zlib }
  - { origin: ../package-bzip2, alias: bzip2 }
  - { origin: ../package-xz, alias: xz }
  - { origin: ../package-zstd, alias: zstd }
  - { origin: ../package-expat, alias: expat }
  - { origin: ../package-openssl, alias: openssl }
  - { origin: ../package-blfs-cmake, alias: blfs-cmake }
  - { origin: ../package-blfs-libarchive, alias: blfs-libarchive }
  - { origin: ../package-meson, alias: meson }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-pkgconf, alias: pkgconf }
var:
  xbee: { version: "0.15.0-9" }
  lfs: { jobs: 4 }
  package:
    name: waybar
    version: "0.15.0"
    source: waybar-0.15.0.tar.gz
    runtime-dependencies: gtkmm,gtk-layer-shell,fmt,spdlog,jsoncpp,libsigc++,wayland,wayland-protocols,libxkbcommon,glib,libinput,libevdev,libnl,pulseaudio,pipewire,wireplumber,systemd
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}"
          "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}"
          "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
