schema-version: 1.0

description: Assemble and validate the prototype XBee LFS package repository.

require: ../../build-system

builder:
  - origin: ../package-manager
    alias: manager
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zstd
    alias: zstd

var:
  xbee:
    version: "0.1.0"

build:
  - shell:
      cmd:
        - apt-get update
        - >-
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          tar zstd
        - >-
          bash "{{ .xbee.resources }}/build-package-repository.sh"
          "/opt/xbee-lfs-native/xbpkg"
          "/opt/xbee-lfs-packages"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
