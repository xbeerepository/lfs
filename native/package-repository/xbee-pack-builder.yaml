var:
  xbee:
    version: "0.34.1"

build:
  - shell:
      cmd:
        - >-
          openssl genpkey -algorithm Ed25519
          -out "{{ .xbee.src }}/repository-signing-key.pem"
        - >-
          bash "{{ .xbee.resources }}/build-package-repository.sh"
          "/opt/xbee-lfs-native/xbpkg"
          "/opt/xbee-lfs-packages"
          "{{ .xbee.src }}/repository-signing-key.pem"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
