schema-version: 1.0
description: Build perl-parse-yapp 1.21 for Samba.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-perl, alias: perl }]
var: { xbee: { version: "1.21-2" }, lfs: { jobs: 4 }, package: { name: perl-parse-yapp, version: "1.21", source: Parse-Yapp-1.21.tar.gz, runtime-dependencies: "perl" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
