schema-version: 1.0
description: Build x264 20250815 H.264 encoder library.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-nasm, alias: blfs-nasm }]
var: { xbee: { version: "20250815-1" }, lfs: { jobs: 4 }, package: { name: x264, version: "20250815", source: x264-20250815.tar.xz, runtime-dependencies: "" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
