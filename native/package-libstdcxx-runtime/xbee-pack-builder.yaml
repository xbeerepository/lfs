schema-version: 1.0

description: Split the GCC C++ runtime libraries into a small XBee LFS package.

require: ../../build-system

builder:
  - origin: ../final-system
    alias: system

var:
  xbee:
    version: "15.2.0-2"
  package:
    name: libstdcxx-runtime
    runtime-dependencies: glibc

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/build-package.sh"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .xbee.src }}" "{{ .xbee.out }}"
