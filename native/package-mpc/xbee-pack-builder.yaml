schema-version: 1.0

description: Build the mpc package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-gmp
    alias: gmp
  - origin: ../package-mpfr
    alias: mpfr

var:
  xbee:
    version: "1.3.1"
  lfs:
    jobs: 4
  package:
    name: mpc
    version: "1.3.1"
    source: mpc-1.3.1.tar.gz
    runtime-dependencies: gmp,mpfr

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
