schema-version: 1.0

description: Build the man-db package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-libpipeline
    alias: libpipeline
  - origin: ../package-zlib
    alias: zlib

var:
  xbee:
    version: "2.13.1"
  lfs:
    jobs: 4
  package:
    name: man-db
    version: "2.13.1"
    source: man-db-2.13.1.tar.xz
    runtime-dependencies: libpipeline,zlib

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
