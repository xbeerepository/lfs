schema-version: 1.0
description: Build glib-networking 2.80.1 for BLFS.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-meson, alias: meson }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-pkgconf, alias: pkgconf }
  - { origin: ../package-blfs-glib, alias: blfs-glib }
  - { origin: ../package-blfs-gnutls, alias: blfs-gnutls }
  - { origin: ../package-blfs-nettle, alias: blfs-nettle }
  - { origin: ../package-blfs-libtasn1, alias: blfs-libtasn1 }
  - { origin: ../package-blfs-p11-kit, alias: blfs-p11-kit }
  - { origin: ../package-blfs-libunistring, alias: blfs-libunistring }
  - { origin: ../package-blfs-gsettings-desktop-schemas, alias: blfs-gsettings-desktop-schemas }
  - { origin: ../package-blfs-make-ca, alias: blfs-make-ca }
var: { xbee: { version: "2.80.1-2" }, lfs: { jobs: 4 }, package: { name: glib-networking, version: "2.80.1", source: glib-networking-2.80.1.tar.xz, runtime-dependencies: "glib,gnutls,nettle,libtasn1,p11-kit,libunistring,gsettings-desktop-schemas,make-ca" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
