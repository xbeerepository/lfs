schema-version: 1.0
description: Build vorbis-tools 1.4.3.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-libogg, alias: blfs-libogg }, { origin: ../package-blfs-libvorbis, alias: blfs-libvorbis }, { origin: ../package-blfs-libao, alias: blfs-libao }, { origin: ../package-blfs-flac, alias: blfs-flac }, { origin: ../package-blfs-speex, alias: blfs-speex }]
var: { xbee: { version: "1.4.3-2" }, lfs: { jobs: 4 }, package: { name: vorbis-tools, version: "1.4.3", source: vorbis-tools-1.4.3.tar.gz, runtime-dependencies: "libogg,libvorbis,libao,flac,speex" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
