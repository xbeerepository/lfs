schema-version: 1.0

description: Build CMake from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-libarchive
    alias: blfs-libarchive
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-expat
    alias: expat

var:
  xbee:
    version: "4.2.3-3"
  lfs:
    jobs: 4
  package:
    name: cmake
    version: "4.2.3"
    source: cmake-4.2.3.tar.gz
    runtime-dependencies: libarchive,libxml2,openssl,zlib,bzip2,xz,zstd,expat

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
