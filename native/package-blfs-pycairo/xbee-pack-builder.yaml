schema-version: 1.0
description: Build pycairo 1.29.0 for the BLFS Bluetooth stack.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-cairo, alias: blfs-cairo }, { origin: ../package-blfs-pixman, alias: blfs-pixman }, { origin: ../package-blfs-libpng, alias: blfs-libpng }, { origin: ../package-blfs-fontconfig, alias: blfs-fontconfig }, { origin: ../package-blfs-freetype, alias: blfs-freetype }, { origin: ../package-blfs-brotli, alias: blfs-brotli }, { origin: ../package-zlib, alias: zlib }, { origin: ../package-bzip2, alias: bzip2 }, { origin: ../package-expat, alias: expat }, { origin: ../package-python, alias: python }]
var: { xbee: { version: "1.29.0-2" }, lfs: { jobs: 4 }, package: { name: pycairo, version: "1.29.0", source: pycairo-1.29.0.tar.gz, runtime-dependencies: "cairo,python" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
