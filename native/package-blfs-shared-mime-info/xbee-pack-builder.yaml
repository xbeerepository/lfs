schema-version: 1.0

description: Build shared-mime-info from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-glib
    alias: blfs-glib
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-util-linux
    alias: util-linux
  - origin: ../package-readline
    alias: readline
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-xz
    alias: xz
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "2.4"
  lfs:
    jobs: 4
  package:
    name: shared-mime-info
    version: "2.4"
    source: shared-mime-info-2.4.tar.gz
    runtime-dependencies: glib,libxml2

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
