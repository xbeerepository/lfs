schema-version: 1.0

description: Build HarfBuzz from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-freetype
    alias: blfs-freetype
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-blfs-graphite2
    alias: blfs-graphite2
  - origin: ../package-blfs-icu
    alias: blfs-icu
  - origin: ../package-blfs-glib
    alias: blfs-glib
  - origin: ../package-blfs-gobject-introspection-core
    alias: blfs-gobject-introspection-core
  - origin: ../package-blfs-glib-gir
    alias: blfs-glib-gir
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-util-linux
    alias: util-linux
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "12.3.2-4"
  lfs:
    jobs: 4
  package:
    name: harfbuzz
    version: "12.3.2"
    source: harfbuzz-12.3.2.tar.xz
    runtime-dependencies: freetype,graphite2,icu,glib,gobject-introspection-core,glib-gir

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
