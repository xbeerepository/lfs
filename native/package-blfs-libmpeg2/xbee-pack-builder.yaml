schema-version: 1.0
description: Build libmpeg2 0.5.1 MPEG video decoder.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }]
var: { xbee: { version: "0.5.1-1" }, lfs: { jobs: 4 }, package: { name: libmpeg2, version: "0.5.1", source: libmpeg2-0.5.1.tar.gz, runtime-dependencies: "" } }
build:
  - shell:
      cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"']
