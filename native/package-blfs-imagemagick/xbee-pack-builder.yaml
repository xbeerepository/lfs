schema-version: 1.0
description: Build imagemagick 7.1.2-13 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-jasper, alias: blfs-jasper }, { origin: ../package-blfs-lcms2, alias: blfs-lcms2 }, { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }, { origin: ../package-blfs-libpng, alias: blfs-libpng }, { origin: ../package-blfs-libraw, alias: blfs-libraw }, { origin: ../package-blfs-librsvg, alias: blfs-librsvg }, { origin: ../package-blfs-libtiff, alias: blfs-libtiff }, { origin: ../package-blfs-libwebp, alias: blfs-libwebp }, { origin: ../package-blfs-openjpeg, alias: blfs-openjpeg }, { origin: ../package-blfs-pango, alias: blfs-pango }, { origin: ../package-blfs-cups, alias: blfs-cups }, { origin: ../package-curl, alias: curl }, { origin: ../package-blfs-ffmpeg, alias: blfs-ffmpeg }, { origin: ../package-blfs-fftw, alias: blfs-fftw }, { origin: ../package-blfs-sane, alias: blfs-sane }, { origin: ../package-blfs-ghostscript, alias: blfs-ghostscript }]
