schema-version: 1.0

description: Build a bootable Sway desktop XBee LFS system from xbpkg packages.

require: ../../build-system

builder:
  - origin: ../package-system-tools
    alias: tools
  - origin: ../package-repository
    alias: repository
  - origin: ../nocloud-agent
    alias: nocloud

var:
  xbee:
    version: "0.12.66"
  lfs:
    hostname: xbee-lfs-sway
    admin_user: xbee
    authorized_key: ""
  image:
    name: xbee-lfs-native-13.0-x86_64-desktop-sway
    extra_size_mib: 1024

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-package-system.sh"
          "/opt/xbee-lfs-repository"
          "{{ .lfs.admin_user }}" "{{ .lfs.hostname }}"
          "{{ .lfs.authorized_key }}"
          "{{ .image.name }}" "{{ .image.extra_size_mib }}"
          "/opt/xbee-lfs-nocloud/xbee-nocloud"
          "/opt/xbee-lfs-native/package-profiles/desktop-sway.txt"
          "{{ .xbee.src }}" "{{ .xbee.out }}"
