schema-version: 1.0

description: Build the Coreutils package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-acl
    alias: acl
  - origin: ../package-attr
    alias: attr
  - origin: ../package-libcap
    alias: libcap
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-gmp
    alias: gmp

var:
  xbee:
    version: "9.10"
  lfs:
    jobs: 4
  package:
    name: coreutils
    version: "9.10"
    source: coreutils-9.10.tar.xz
    runtime-dependencies: acl,attr,libcap,openssl,gmp

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
