schema-version: 1.0

description: Build the attr package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system

var:
  xbee:
    version: "2.5.2"
  lfs:
    jobs: 4
  package:
    name: attr
    version: "2.5.2"
    source: attr-2.5.2.tar.gz
    runtime-dependencies: ""

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
