schema-version: 1.0
description: Build libwebp 1.6.0 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }, { origin: ../package-blfs-libpng, alias: blfs-libpng }, { origin: ../package-blfs-libtiff, alias: blfs-libtiff }]
var: { xbee: { version: "1.6.0-1" }, lfs: { jobs: 4 }, package: { name: libwebp, version: "1.6.0", source: libwebp-1.6.0.tar.gz, runtime-dependencies: "libjpeg-turbo,libpng,libtiff" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
