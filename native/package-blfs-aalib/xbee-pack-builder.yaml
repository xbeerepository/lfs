schema-version: 1.0
description: Build aalib 1.4rc5 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-ncurses, alias: ncurses }]
var: { xbee: { version: "1.4rc5-1" }, lfs: { jobs: 4 }, package: { name: aalib, version: "1.4rc5", source: aalib-1.4rc5.tar.gz, runtime-dependencies: "ncurses" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
