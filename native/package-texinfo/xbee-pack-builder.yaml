schema-version: 1.0

description: Build the Texinfo package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-perl
    alias: perl
  - origin: ../package-ncurses
    alias: ncurses

var:
  xbee:
    version: "7.2"
  lfs:
    jobs: 4
  package:
    name: texinfo
    version: "7.2"
    source: texinfo-7.2.tar.xz
    runtime-dependencies: perl,ncurses

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
