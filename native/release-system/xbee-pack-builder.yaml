schema-version: 1.0

description: Package the BIOS and UEFI LFS cloud images as a distributable release.

require: ../../build-system

builder:
  - origin: ../cloud-image
    alias: bios
  - origin: ../uefi-system
    alias: uefi

var:
  xbee:
    version: "13.0"
  release:
    name: xbee-lfs-native-13.0-x86_64

build:
  - shell:
      cmd:
        - apt-get update
        - >-
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          mount qemu-utils tar zstd
        - >-
          bash "{{ .xbee.resources }}/build-release-system.sh"
          "/opt/xbee-lfs-native/xbee-lfs-native-13.0-x86_64-cloud.qcow2"
          "/opt/xbee-lfs-native/cloud-metadata.yaml"
          "/opt/xbee-lfs-native/xbee-lfs-native-13.0-x86_64-uefi.qcow2"
          "/opt/xbee-lfs-native/uefi-metadata.yaml"
          "{{ .release.name }}"
          "{{ .xbee.resources }}"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
