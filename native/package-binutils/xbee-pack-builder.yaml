schema-version: 1.0

description: Build the binutils package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-flex
    alias: flex

var:
  xbee:
    version: "2.46.0"
  lfs:
    jobs: 4
  package:
    name: binutils
    version: "2.46.0"
    source: binutils-2.46.0.tar.xz
    runtime-dependencies: zlib,zstd,flex

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
