schema-version: 1.0

description: Build GLib from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-util-linux
    alias: util-linux

var:
  xbee:
    version: "2.86.4"
  lfs:
    jobs: 4
  package:
    name: glib
    version: "2.86.4"
    source: glib-2.86.4.tar.xz
    runtime-dependencies: libffi,pcre2,zlib,util-linux

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
