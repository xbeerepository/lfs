schema-version: 1.0

description: Build Pango from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-fribidi
    alias: blfs-fribidi
  - origin: ../package-blfs-cairo
    alias: blfs-cairo
  - origin: ../package-blfs-pixman
    alias: blfs-pixman
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-fontconfig
    alias: blfs-fontconfig
  - origin: ../package-blfs-freetype
    alias: blfs-freetype
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-blfs-harfbuzz
    alias: blfs-harfbuzz
  - origin: ../package-blfs-graphite2
    alias: blfs-graphite2
  - origin: ../package-blfs-icu
    alias: blfs-icu
  - origin: ../package-blfs-glib
    alias: blfs-glib
  - origin: ../package-blfs-gobject-introspection
    alias: blfs-gobject-introspection
  - origin: ../package-blfs-glib-gir
    alias: blfs-glib-gir
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-expat
    alias: expat
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-util-linux
    alias: util-linux
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "1.57.0-2"
  lfs:
    jobs: 4
  package:
    name: pango
    version: "1.57.0"
    source: pango-1.57.0.tar.xz
    runtime-dependencies: fontconfig,fribidi,glib,gobject-introspection,glib-gir,harfbuzz,cairo

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
