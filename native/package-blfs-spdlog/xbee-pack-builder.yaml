schema-version: 1.0

description: Build spdlog 1.17.0 with the external fmt library.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-fmt
    alias: blfs-fmt
  - origin: ../package-blfs-cmake
    alias: blfs-cmake
  - origin: ../package-blfs-libarchive
    alias: blfs-libarchive
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-expat
    alias: expat
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "1.17.0-2"
  lfs:
    jobs: 4
  package:
    name: spdlog
    version: "1.17.0"
    source: spdlog-1.17.0.tar.gz
    runtime-dependencies: fmt

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
