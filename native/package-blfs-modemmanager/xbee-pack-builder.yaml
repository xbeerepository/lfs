schema-version: 1.0
description: Build modemmanager 1.24.2 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-libgudev, alias: blfs-libgudev }, { origin: ../package-blfs-polkit, alias: blfs-polkit }, { origin: ../package-blfs-libxslt, alias: blfs-libxslt }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }]
var: { xbee: { version: "1.24.2-5" }, lfs: { jobs: 4 }, package: { name: modemmanager, version: "1.24.2", source: ModemManager-1.24.2.tar.gz, runtime-dependencies: "glib,libgudev,polkit" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
