schema-version: 1.0

description: Extend the verified native source artefact with the LFS chapter 8 sources.

require: ../../build-system

builder:
  - origin: ../sources
    alias: base

var:
  xbee:
    version: "13.0"
  sources:
    retries: 3

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/download-final-sources.sh"
          "/opt/xbee-lfs-native/sources"
          "{{ .xbee.resources }}/sources.tsv"
          "{{ .sources.retries }}"
          "{{ .xbee.out }}"
