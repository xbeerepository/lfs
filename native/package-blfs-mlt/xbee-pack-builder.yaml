schema-version: 1.0
description: Build MLT 7.36.1 multimedia framework without Qt.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-cmake, alias: blfs-cmake }, { origin: ../package-blfs-libarchive, alias: blfs-libarchive }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }, { origin: ../package-openssl, alias: openssl }, { origin: ../package-zlib, alias: zlib }, { origin: ../package-bzip2, alias: bzip2 }, { origin: ../package-xz, alias: xz }, { origin: ../package-zstd, alias: zstd }, { origin: ../package-expat, alias: expat }, { origin: ../package-blfs-ffmpeg, alias: blfs-ffmpeg }, { origin: ../package-blfs-frei0r, alias: blfs-frei0r }, { origin: ../package-blfs-libsamplerate, alias: blfs-libsamplerate }, { origin: ../package-blfs-gdk-pixbuf, alias: blfs-gdk-pixbuf }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-shared-mime-info, alias: blfs-shared-mime-info }, { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }, { origin: ../package-blfs-giflib, alias: blfs-giflib }, { origin: ../package-blfs-libtiff, alias: blfs-libtiff }, { origin: ../package-blfs-sdl2-compat, alias: blfs-sdl2-compat }, { origin: ../package-blfs-sdl3, alias: blfs-sdl3 }, { origin: ../package-blfs-alsa-lib, alias: blfs-alsa-lib }, { origin: ../package-blfs-libdrm, alias: blfs-libdrm }, { origin: ../package-blfs-libxkbcommon, alias: blfs-libxkbcommon }, { origin: ../package-blfs-mesa, alias: blfs-mesa }, { origin: ../package-blfs-pipewire, alias: blfs-pipewire }, { origin: ../package-blfs-pulseaudio, alias: blfs-pulseaudio }, { origin: ../package-blfs-wayland, alias: blfs-wayland }, { origin: ../package-blfs-wayland-protocols, alias: blfs-wayland-protocols }, { origin: ../package-blfs-libvorbis, alias: blfs-libvorbis }, { origin: ../package-blfs-libogg, alias: blfs-libogg }]
var: { xbee: { version: "7.36.1-5" }, lfs: { jobs: 4 }, package: { name: mlt, version: "7.36.1", source: mlt-7.36.1.tar.gz, runtime-dependencies: "ffmpeg,frei0r,libsamplerate,gdk-pixbuf,glib,shared-mime-info,libjpeg-turbo,giflib,libtiff,sdl2-compat,sdl3,alsa-lib,libdrm,libxkbcommon,mesa,pipewire,pulseaudio,wayland,wayland-protocols,libvorbis,libogg" } }
build:
  - shell:
      cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"']
