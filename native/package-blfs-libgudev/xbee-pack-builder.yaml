schema-version: 1.0
description: Build libgudev 238 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-systemd, alias: systemd }]
var: { xbee: { version: "238-1" }, lfs: { jobs: 4 }, package: { name: libgudev, version: "238", source: libgudev-238.tar.xz, runtime-dependencies: "glib,systemd" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
