schema-version: 1.0

description: Build the Python package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-ncurses
    alias: ncurses
  - origin: ../package-readline
    alias: readline
  - origin: ../package-libffi
    alias: libffi
  - origin: ../package-expat
    alias: expat
  - origin: ../package-gdbm
    alias: gdbm
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-sqlite
    alias: sqlite

var:
  xbee:
    version: "3.14.3"
  lfs:
    jobs: 4
  package:
    name: python
    version: "3.14.3"
    source: Python-3.14.3.tar.xz
    runtime-dependencies: bzip2,xz,zlib,zstd,ncurses,readline,libffi,expat,gdbm,openssl,sqlite

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ .package.runtime-dependencies }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
