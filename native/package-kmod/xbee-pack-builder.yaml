schema-version: 1.0

description: Build the kmod package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-zstd
    alias: zstd
  - origin: ../package-xz
    alias: xz
  - origin: ../package-openssl
    alias: openssl

var:
  xbee:
    version: "34.2"
  lfs:
    jobs: 4
  package:
    name: kmod
    version: "34.2"
    source: kmod-34.2.tar.xz
    runtime-dependencies: zlib,zstd,xz,openssl

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
