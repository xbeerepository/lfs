schema-version: 1.0
description: Build libvpx 1.16.0 VP8 and VP9 codecs.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-nasm, alias: blfs-nasm }, { origin: ../package-blfs-which, alias: blfs-which }]
var: { xbee: { version: "1.16.0-2" }, lfs: { jobs: 4 }, package: { name: libvpx, version: "1.16.0", source: libvpx-1.16.0.tar.gz, runtime-dependencies: "" } }
build:
  - shell:
      cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"']
