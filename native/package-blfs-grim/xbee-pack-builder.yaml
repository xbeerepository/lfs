schema-version: 1.0

description: Build the Grim 1.4.0 native Wayland screenshot utility.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-wayland
    alias: blfs-wayland
  - origin: ../package-blfs-wayland-protocols
    alias: blfs-wayland-protocols
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-libjpeg-turbo
    alias: blfs-libjpeg-turbo
  - origin: ../package-blfs-pixman
    alias: blfs-pixman
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "1.4.0-1"
  lfs:
    jobs: 4
  package:
    name: grim
    version: "1.4.0"
    source: grim-1.4.0.tar.gz
    runtime-dependencies: wayland,wayland-protocols,libxml2,libpng,libjpeg-turbo,pixman

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
