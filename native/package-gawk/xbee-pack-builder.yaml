schema-version: 1.0

description: Build the Gawk package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-gmp
    alias: gmp
  - origin: ../package-mpfr
    alias: mpfr
  - origin: ../package-readline
    alias: readline

var:
  xbee:
    version: "5.3.2"
  lfs:
    jobs: 4
  package:
    name: gawk
    version: "5.3.2"
    source: gawk-5.3.2.tar.xz
    runtime-dependencies: gmp,mpfr,readline

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
