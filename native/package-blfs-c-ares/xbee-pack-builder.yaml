schema-version: 1.0

description: Build the c-ares asynchronous DNS library from BLFS 13.0.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
var:
  xbee:
    version: "1.34.6-3"
  lfs:
    jobs: 4
  package:
    name: c-ares
    version: "1.34.6"
    source: c-ares-1.34.6.tar.gz
    runtime-dependencies: ""

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
