schema-version: 1.0
description: Build libtirpc 1.3.7 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-rpcsvc-proto, alias: blfs-rpcsvc-proto }]
var: { xbee: { version: "1.3.7-1" }, lfs: { jobs: 4 }, package: { name: libtirpc, version: "1.3.7", source: libtirpc-1.3.7.tar.bz2, runtime-dependencies: "rpcsvc-proto" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
