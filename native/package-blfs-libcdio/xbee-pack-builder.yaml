schema-version: 1.0
description: Build libcdio 2.1.0 and libcdio-paranoia 10.2+2.0.2.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-blfs-libcddb, alias: blfs-libcddb }
  - { origin: ../package-ncurses, alias: ncurses }
var:
  xbee: { version: "2.1.0-3" }
  lfs: { jobs: 4 }
  package: { name: libcdio, version: "2.1.0", source: libcdio-2.1.0.tar.bz2, runtime-dependencies: "libcddb,ncurses" }
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}"
          "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
