schema-version: 1.0
description: Build libgsf 1.14.55 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }]
var: { xbee: { version: "1.14.55-1" }, lfs: { jobs: 4 }, package: { name: libgsf, version: "1.14.55", source: libgsf-1.14.55.tar.xz, runtime-dependencies: "glib,libxml2" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
