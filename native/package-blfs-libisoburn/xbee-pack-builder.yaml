schema-version: 1.0
description: Build libisoburn 1.5.6.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-libburn, alias: blfs-libburn }, { origin: ../package-blfs-libisofs, alias: blfs-libisofs }, { origin: ../package-pkgconf, alias: pkgconf }]
var: { xbee: { version: "1.5.6-1" }, lfs: { jobs: 4 }, package: { name: libisoburn, version: "1.5.6", source: libisoburn-1.5.6.tar.gz, runtime-dependencies: "libburn,libisofs" } }
