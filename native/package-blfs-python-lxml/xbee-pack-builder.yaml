schema-version: 1.0
description: Build python-lxml 6.0.2 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-python, alias: python }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }, { origin: ../package-blfs-libxslt, alias: blfs-libxslt }]
var: { xbee: { version: "6.0.2-1" }, lfs: { jobs: 4 }, package: { name: python-lxml, version: "6.0.2", source: lxml-6.0.2.tar.gz, runtime-dependencies: "libxml2,libxslt" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
