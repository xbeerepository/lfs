schema-version: 1.0
description: Build liba52 0.8.0 for ATSC A/52 decoding.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
var:
  xbee: { version: "0.8.0-1" }
  lfs: { jobs: 4 }
  package: { name: liba52, version: "0.8.0", source: a52dec-0.8.0.tar.gz, runtime-dependencies: "" }
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}"
          "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
