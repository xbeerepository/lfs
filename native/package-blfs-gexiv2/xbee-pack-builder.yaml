schema-version: 1.0
description: Build gexiv2 0.14.6 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-glib-gir, alias: blfs-glib-gir }, { origin: ../package-blfs-exiv2, alias: blfs-exiv2 }, { origin: ../package-blfs-inih, alias: blfs-inih }, { origin: ../package-blfs-brotli, alias: blfs-brotli }, { origin: ../package-blfs-gobject-introspection, alias: blfs-gobject-introspection }, { origin: ../package-blfs-pygobject, alias: blfs-pygobject }]
var: { xbee: { version: "0.14.6-4" }, lfs: { jobs: 4 }, package: { name: gexiv2, version: "0.14.6", source: gexiv2-0.14.6.tar.xz, runtime-dependencies: "glib,glib-gir,exiv2,inih,brotli,gobject-introspection,pygobject" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
