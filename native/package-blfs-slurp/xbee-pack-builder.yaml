schema-version: 1.0

description: Build the Slurp 1.5.0 native Wayland region selector.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-wayland
    alias: blfs-wayland
  - origin: ../package-blfs-wayland-protocols
    alias: blfs-wayland-protocols
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-blfs-libxkbcommon
    alias: blfs-libxkbcommon
  - origin: ../package-blfs-cairo
    alias: blfs-cairo
  - origin: ../package-blfs-pixman
    alias: blfs-pixman
  - origin: ../package-blfs-libpng
    alias: blfs-libpng
  - origin: ../package-blfs-fontconfig
    alias: blfs-fontconfig
  - origin: ../package-blfs-freetype
    alias: blfs-freetype
  - origin: ../package-blfs-brotli
    alias: blfs-brotli
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-expat
    alias: expat
  - origin: ../package-meson
    alias: meson
  - origin: ../package-ninja
    alias: ninja
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "1.5.0-1"
  lfs:
    jobs: 4
  package:
    name: slurp
    version: "1.5.0"
    source: slurp-1.5.0.tar.gz
    runtime-dependencies: wayland,wayland-protocols,libxml2,libxkbcommon,cairo,pixman

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
