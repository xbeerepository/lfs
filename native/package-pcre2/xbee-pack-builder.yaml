schema-version: 1.0

description: Build the pcre2 package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-readline
    alias: readline

var:
  xbee:
    version: "10.47"
  lfs:
    jobs: 4
  package:
    name: pcre2
    version: "10.47"
    source: pcre2-10.47.tar.bz2
    runtime-dependencies: zlib,bzip2,readline

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
