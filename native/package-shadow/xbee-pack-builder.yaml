schema-version: 1.0

description: Build the shadow package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-libxcrypt
    alias: libxcrypt
  - origin: ../package-attr
    alias: attr
  - origin: ../package-acl
    alias: acl

var:
  xbee:
    version: "4.19.3"
  lfs:
    jobs: 4
  package:
    name: shadow
    version: "4.19.3"
    source: shadow-4.19.3.tar.xz
    runtime-dependencies: libxcrypt,attr,acl

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ .package.runtime-dependencies }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
