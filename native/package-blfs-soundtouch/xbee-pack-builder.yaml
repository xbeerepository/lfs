schema-version: 1.0
description: Build SoundTouch 2.4.0 audio processing library.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-autoconf, alias: autoconf }, { origin: ../package-automake, alias: automake }, { origin: ../package-libtool, alias: libtool }]
var: { xbee: { version: "2.4.0-1" }, lfs: { jobs: 4 }, package: { name: soundtouch, version: "2.4.0", source: soundtouch-2.4.0.tar.gz, runtime-dependencies: "" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
