schema-version: 1.0
description: Build libsamplerate 0.2.2 audio sample rate converter.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-alsa-lib, alias: blfs-alsa-lib }, { origin: ../package-blfs-libsndfile, alias: blfs-libsndfile }]
var: { xbee: { version: "0.2.2-1" }, lfs: { jobs: 4 }, package: { name: libsamplerate, version: "0.2.2", source: libsamplerate-0.2.2.tar.xz, runtime-dependencies: "alsa-lib,libsndfile" } }
build:
  - shell:
      cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"']
