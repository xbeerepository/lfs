schema-version: 1.0
description: Build upower 1.91.1 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-meson, alias: meson }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-libgudev, alias: blfs-libgudev }, { origin: ../package-blfs-libusb, alias: blfs-libusb }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-dbus, alias: dbus }, { origin: ../package-systemd, alias: systemd }]
var: { xbee: { version: "1.91.1-1" }, lfs: { jobs: 4 }, package: { name: upower, version: "1.91.1", source: upower-v1.91.1.tar.bz2, runtime-dependencies: "libgudev,libusb,glib,dbus,systemd" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
