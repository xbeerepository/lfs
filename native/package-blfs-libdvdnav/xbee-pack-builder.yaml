schema-version: 1.0
description: Build libdvdnav 7.0.0 DVD navigation library.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-meson, alias: meson }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-blfs-libdvdread, alias: blfs-libdvdread }
  - { origin: ../package-blfs-libdvdcss, alias: blfs-libdvdcss }
var:
  xbee: { version: "7.0.0-2" }
  lfs: { jobs: 4 }
  package: { name: libdvdnav, version: "7.0.0", source: libdvdnav-7.0.0.tar.xz, runtime-dependencies: "libdvdread,libdvdcss" }
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}"
          "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
