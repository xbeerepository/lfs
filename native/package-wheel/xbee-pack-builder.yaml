schema-version: 1.0

description: Build the Wheel package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-python
    alias: python
  - origin: ../package-flit-core
    alias: flit-core

var:
  xbee:
    version: "0.46.3"
  lfs:
    jobs: 4
  package:
    name: wheel
    version: "0.46.3"
    source: wheel-0.46.3.tar.gz
    runtime-dependencies: python,flit-core

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
