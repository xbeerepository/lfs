schema-version: 1.0
description: Build avahi 0.8 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-libdaemon, alias: blfs-libdaemon }, { origin: ../package-dbus, alias: dbus }]
var: { xbee: { version: "0.8-1" }, lfs: { jobs: 4 }, package: { name: avahi, version: "0.8", source: avahi-0.8.tar.gz, runtime-dependencies: "glib,libdaemon,dbus" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
