schema-version: 1.0
description: Provide gobject-introspection through the bootstrap core package.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-gobject-introspection-core, alias: blfs-gobject-introspection-core }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-mako, alias: blfs-mako }, { origin: ../package-blfs-cairo, alias: blfs-cairo }, { origin: ../package-blfs-libpng, alias: blfs-libpng }, { origin: ../package-blfs-fontconfig, alias: blfs-fontconfig }, { origin: ../package-blfs-freetype, alias: blfs-freetype }, { origin: ../package-blfs-pixman, alias: blfs-pixman }, { origin: ../package-blfs-brotli, alias: blfs-brotli }]
