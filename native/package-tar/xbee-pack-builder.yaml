schema-version: 1.0

description: Build the Tar package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-acl
    alias: acl
  - origin: ../package-attr
    alias: attr
  - origin: ../package-bzip2
    alias: bzip2
  - origin: ../package-gzip
    alias: gzip
  - origin: ../package-xz
    alias: xz
  - origin: ../package-zstd
    alias: zstd

var:
  xbee:
    version: "1.35"
  lfs:
    jobs: 4
  package:
    name: tar
    version: "1.35"
    source: tar-1.35.tar.xz
    runtime-dependencies: acl,attr,bzip2,gzip,xz,zstd

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ .package.runtime-dependencies }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
