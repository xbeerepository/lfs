schema-version: 1.0
description: Build openjpeg 2.5.4 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-cmake, alias: blfs-cmake }, { origin: ../package-blfs-libarchive, alias: blfs-libarchive }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }, { origin: ../package-openssl, alias: openssl }, { origin: ../package-zlib, alias: zlib }, { origin: ../package-bzip2, alias: bzip2 }, { origin: ../package-xz, alias: xz }, { origin: ../package-zstd, alias: zstd }, { origin: ../package-expat, alias: expat }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-libpng, alias: blfs-libpng }, { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }, { origin: ../package-blfs-libtiff, alias: blfs-libtiff }, { origin: ../package-blfs-lcms2, alias: blfs-lcms2 }]
var: { xbee: { version: "2.5.4-4" }, lfs: { jobs: 4 }, package: { name: openjpeg, version: "2.5.4", source: openjpeg-2.5.4.tar.gz, runtime-dependencies: "libpng,libjpeg-turbo,libtiff,lcms2" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
