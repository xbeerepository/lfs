schema-version: 1.0
description: Build SDL 3.4.0 multimedia library.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-cmake, alias: blfs-cmake }, { origin: ../package-blfs-libarchive, alias: blfs-libarchive }, { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }, { origin: ../package-openssl, alias: openssl }, { origin: ../package-zlib, alias: zlib }, { origin: ../package-bzip2, alias: bzip2 }, { origin: ../package-xz, alias: xz }, { origin: ../package-zstd, alias: zstd }, { origin: ../package-expat, alias: expat }, { origin: ../package-ninja, alias: ninja }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-alsa-lib, alias: blfs-alsa-lib }, { origin: ../package-blfs-libdrm, alias: blfs-libdrm }, { origin: ../package-blfs-libxkbcommon, alias: blfs-libxkbcommon }, { origin: ../package-blfs-mesa, alias: blfs-mesa }, { origin: ../package-blfs-pipewire, alias: blfs-pipewire }, { origin: ../package-blfs-pulseaudio, alias: blfs-pulseaudio }, { origin: ../package-blfs-wayland, alias: blfs-wayland }, { origin: ../package-blfs-wayland-protocols, alias: blfs-wayland-protocols }]
var: { xbee: { version: "3.4.0-4" }, lfs: { jobs: 4 }, package: { name: sdl3, version: "3.4.0", source: SDL3-3.4.0.tar.gz, runtime-dependencies: "alsa-lib,libdrm,libxkbcommon,mesa,pipewire,pulseaudio,wayland,wayland-protocols,libarchive,libxml2,openssl,zlib,bzip2,xz,zstd,expat" } }
build:
  - shell:
      cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"']
