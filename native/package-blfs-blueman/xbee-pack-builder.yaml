schema-version: 1.0
description: Build blueman 2.4.6 for the BLFS Bluetooth stack.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-pkgconf, alias: pkgconf }
  - { origin: ../package-blfs-bluez, alias: blfs-bluez }
  - { origin: ../package-blfs-pygobject, alias: blfs-pygobject }
  - { origin: ../package-blfs-pycairo, alias: blfs-pycairo }
  - { origin: ../package-blfs-gtk3, alias: blfs-gtk3 }
  - { origin: ../package-blfs-polkit, alias: blfs-polkit }
  - { origin: ../package-blfs-libnotify, alias: blfs-libnotify }
  - { origin: ../package-blfs-thunar, alias: blfs-thunar }
  - { origin: ../package-python, alias: python }
  - { origin: ../package-blfs-cython, alias: blfs-cython }
  - { origin: ../package-blfs-at-spi2-core, alias: blfs-at-spi2-core }
  - { origin: ../package-blfs-glib, alias: blfs-glib }
  - { origin: ../package-blfs-gobject-introspection, alias: blfs-gobject-introspection }
  - { origin: ../package-blfs-glib-gir, alias: blfs-glib-gir }
  - { origin: ../package-blfs-libepoxy, alias: blfs-libepoxy }
  - { origin: ../package-blfs-mesa, alias: blfs-mesa }
  - { origin: ../package-blfs-cairo, alias: blfs-cairo }
  - { origin: ../package-blfs-pango, alias: blfs-pango }
  - { origin: ../package-blfs-fribidi, alias: blfs-fribidi }
  - { origin: ../package-blfs-gdk-pixbuf, alias: blfs-gdk-pixbuf }
  - { origin: ../package-blfs-shared-mime-info, alias: blfs-shared-mime-info }
  - { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }
  - { origin: ../package-blfs-giflib, alias: blfs-giflib }
  - { origin: ../package-blfs-libxkbcommon, alias: blfs-libxkbcommon }
  - { origin: ../package-blfs-wayland, alias: blfs-wayland }
  - { origin: ../package-blfs-wayland-protocols, alias: blfs-wayland-protocols }
  - { origin: ../package-blfs-pixman, alias: blfs-pixman }
  - { origin: ../package-blfs-fontconfig, alias: blfs-fontconfig }
  - { origin: ../package-blfs-freetype, alias: blfs-freetype }
  - { origin: ../package-blfs-libpng, alias: blfs-libpng }
  - { origin: ../package-blfs-brotli, alias: blfs-brotli }
  - { origin: ../package-blfs-graphite2, alias: blfs-graphite2 }
  - { origin: ../package-blfs-icu, alias: blfs-icu }
  - { origin: ../package-libffi, alias: libffi }
  - { origin: ../package-pcre2, alias: pcre2 }
  - { origin: ../package-util-linux, alias: util-linux }
  - { origin: ../package-readline, alias: readline }
  - { origin: ../package-zlib, alias: zlib }
  - { origin: ../package-bzip2, alias: bzip2 }
  - { origin: ../package-xz, alias: xz }
  - { origin: ../package-expat, alias: expat }
  - { origin: ../package-blfs-harfbuzz, alias: blfs-harfbuzz }
var:
  xbee: { version: "2.4.6-4" }
  lfs: { jobs: 4 }
  package:
    name: blueman
    version: "2.4.6"
    source: blueman-2.4.6.tar.gz
    runtime-dependencies: "bluez,pygobject,pycairo,gtk3,polkit,libnotify,thunar,python,cython,at-spi2-core,glib,gobject-introspection,glib-gir,libepoxy,mesa,cairo,pango,fribidi,gdk-pixbuf,shared-mime-info,libjpeg-turbo,giflib,libxkbcommon,wayland,wayland-protocols,pixman,fontconfig,freetype,libpng,brotli,graphite2,icu,libffi,pcre2,util-linux,readline,zlib,bzip2,xz,expat,harfbuzz"
build:
  - shell:
      cmd:
        - 'bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'
