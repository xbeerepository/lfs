schema-version: 1.0

description: Build the Wget package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-zlib
    alias: zlib
  - origin: ../package-pcre2
    alias: pcre2
  - origin: ../package-util-linux
    alias: util-linux
  - origin: ../package-ca-certificates
    alias: ca-certificates

var:
  xbee:
    version: "1.25.0"
  lfs:
    jobs: 4
  package:
    name: wget
    version: "1.25.0"
    source: wget-1.25.0.tar.gz
    runtime-dependencies: openssl,zlib,pcre2,util-linux,ca-certificates

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
