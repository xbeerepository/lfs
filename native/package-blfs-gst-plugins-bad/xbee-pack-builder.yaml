schema-version: 1.0
description: Build GStreamer Bad Plug-ins 1.28.1.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-meson, alias: meson }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-pkgconf, alias: pkgconf }
  - { origin: ../package-blfs-glib, alias: blfs-glib }
  - { origin: ../package-blfs-gstreamer, alias: blfs-gstreamer }
  - { origin: ../package-blfs-gst-plugins-base, alias: blfs-gst-plugins-base }
  - { origin: ../package-blfs-gst-plugins-good, alias: blfs-gst-plugins-good }
  - { origin: ../package-curl, alias: curl }
  - { origin: ../package-blfs-faac, alias: blfs-faac }
  - { origin: ../package-blfs-faad2, alias: blfs-faad2 }
  - { origin: ../package-blfs-fdk-aac, alias: blfs-fdk-aac }
  - { origin: ../package-blfs-gtk3, alias: blfs-gtk3 }
  - { origin: ../package-blfs-json-glib, alias: blfs-json-glib }
  - { origin: ../package-blfs-librsvg, alias: blfs-librsvg }
  - { origin: ../package-blfs-libsndfile, alias: blfs-libsndfile }
  - { origin: ../package-blfs-libssh2, alias: blfs-libssh2 }
  - { origin: ../package-blfs-libxkbcommon, alias: blfs-libxkbcommon }
  - { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }
  - { origin: ../package-openssl, alias: openssl }
  - { origin: ../package-blfs-pango, alias: blfs-pango }
  - { origin: ../package-blfs-wayland, alias: blfs-wayland }
  - { origin: ../package-blfs-libaom, alias: blfs-libaom }
  - { origin: ../package-blfs-libva, alias: blfs-libva }
  - { origin: ../package-blfs-libass, alias: blfs-libass }
  - { origin: ../package-blfs-libde265, alias: blfs-libde265 }
  - { origin: ../package-blfs-libdvdread, alias: blfs-libdvdread }
  - { origin: ../package-blfs-libdvdnav, alias: blfs-libdvdnav }
var:
  xbee: { version: "1.28.1-4" }
  lfs: { jobs: 4 }
  package:
    name: gst-plugins-bad
    version: "1.28.1"
    source: gst-plugins-bad-1.28.1.tar.xz
    runtime-dependencies: glib,gstreamer,gst-plugins-base,gst-plugins-good,curl,faac,faad2,fdk-aac,gtk3,json-glib,librsvg,libsndfile,libssh2,libxkbcommon,libxml2,openssl,pango,wayland,libaom,libva,libass,libde265,libdvdread,libdvdnav
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}"
          "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}"
          "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
