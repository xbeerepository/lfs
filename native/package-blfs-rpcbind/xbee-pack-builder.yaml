schema-version: 1.0
description: Build rpcbind 1.2.8 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-libtirpc, alias: blfs-libtirpc }]
var: { xbee: { version: "1.2.8-1" }, lfs: { jobs: 4 }, package: { name: rpcbind, version: "1.2.8", source: rpcbind-1.2.8.tar.bz2, runtime-dependencies: "libtirpc" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
