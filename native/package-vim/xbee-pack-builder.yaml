schema-version: 1.0

description: Build the Vim package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-ncurses
    alias: ncurses
  - origin: ../package-acl
    alias: acl

var:
  xbee:
    version: "9.2.0078"
  lfs:
    jobs: 4
  package:
    name: vim
    version: "9.2.0078"
    source: vim-9.2.0078.tar.gz
    runtime-dependencies: ncurses,acl

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
