schema-version: 1.0

description: Build libssh2 from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-openssl
    alias: openssl
  - origin: ../package-zlib
    alias: zlib

var:
  xbee:
    version: "1.11.1"
  lfs:
    jobs: 4
  package:
    name: libssh2
    version: "1.11.1"
    source: libssh2-1.11.1.tar.gz
    runtime-dependencies: openssl,zlib

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
