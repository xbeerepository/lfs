schema-version: 1.0

description: Build the meson package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-python
    alias: python
  - origin: ../package-packaging
    alias: packaging

var:
  xbee:
    version: "1.10.1"
  lfs:
    jobs: 4
  package:
    name: meson
    version: "1.10.1"
    source: meson-1.10.1.tar.gz
    runtime-dependencies: python,packaging

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ .package.runtime-dependencies }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
