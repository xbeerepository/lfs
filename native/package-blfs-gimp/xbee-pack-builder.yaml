var:
  xbee: { version: "3.0.6-15" }
  lfs: { jobs: 4 }
  package:
    name: gimp
    version: "3.0.6"
    source: gimp-3.0.6.tar.xz
    runtime-dependencies: "appstream,appstream-glib,curl,ca-certificates,nghttp2,c-ares,libidn2,libpsl,libssh2,itstool,python-lxml,libfyaml,libxmlb,docbook-xml,docbook-xsl-nons,libarchive,openssl,zstd,gegl,gexiv2,exiv2,inih,glib-networking,gnutls,nettle,libtasn1,p11-kit,libunistring,gsettings-desktop-schemas,make-ca,gtk3,babl,at-spi2-core,glib,json-glib,gobject-introspection,glib-gir,pygobject,pycairo,python,libepoxy,mesa,cairo,pango,fribidi,gdk-pixbuf,shared-mime-info,libjpeg-turbo,giflib,libxkbcommon,wayland,wayland-protocols,pixman,fontconfig,freetype,libpng,brotli,graphite2,icu,libffi,pcre2,util-linux,readline,zlib,bzip2,xz,expat,harfbuzz,libmypaint,json-c,librsvg,libtiff,libxml2,libxslt,lcms2,mypaint-brushes,poppler,poppler-data,aalib,libwebp,openjpeg,desktop-file-utils,hicolor-icon-theme"
build:
  - shell:
      cmd:
        - 'bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'
