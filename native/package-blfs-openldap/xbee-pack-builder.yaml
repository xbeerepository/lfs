schema-version: 1.0
description: Build openldap 2.6.12 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-cyrus-sasl, alias: blfs-cyrus-sasl }, { origin: ../package-openssl, alias: openssl }]
var: { xbee: { version: "2.6.12-1" }, lfs: { jobs: 4 }, package: { name: openldap, version: "2.6.12", source: openldap-2.6.12.tgz, runtime-dependencies: "cyrus-sasl,openssl" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
