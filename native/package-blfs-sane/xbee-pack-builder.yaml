schema-version: 1.0
description: Build sane 1.4.0 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-avahi, alias: blfs-avahi }, { origin: ../package-blfs-cups, alias: blfs-cups }, { origin: ../package-blfs-libjpeg-turbo, alias: blfs-libjpeg-turbo }, { origin: ../package-blfs-libtiff, alias: blfs-libtiff }, { origin: ../package-blfs-libusb, alias: blfs-libusb }, { origin: ../package-blfs-v4l-utils, alias: blfs-v4l-utils }]
var: { xbee: { version: "1.4.0-1" }, lfs: { jobs: 4 }, package: { name: sane, version: "1.4.0", source: sane-backends-1.4.0.tar.gz, runtime-dependencies: "avahi,cups,libjpeg-turbo,libtiff,libusb,v4l-utils" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
