schema-version: 1.0

description: Produce a generic NoCloud-compatible LFS image with first-boot SSH provisioning.

require: ../../build-system

builder:
  - origin: ../provisioned-system
    alias: provisioned
  - origin: ../nocloud-agent
    alias: nocloud

var:
  xbee:
    version: "13.0"
  lfs:
    admin_user: xbee
  image:
    name: xbee-lfs-native-13.0-x86_64-cloud
    extra_size_mib: 1024

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/build-cloud-image.sh"
          "/opt/xbee-lfs-native/provisioned-rootfs.tar.zst"
          "{{ .lfs.admin_user }}"
          "{{ .image.name }}"
          "{{ .image.extra_size_mib }}"
          "/opt/xbee-lfs-nocloud/xbee-nocloud"
          "{{ .xbee.src }}"
          "{{ .xbee.out }}"
