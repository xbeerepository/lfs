schema-version: 1.0
description: Build libblockdev 3.4.0 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-python, alias: python }, { origin: ../package-pkgconf, alias: pkgconf }, { origin: ../package-blfs-glib, alias: blfs-glib }, { origin: ../package-blfs-json-c, alias: blfs-json-c }, { origin: ../package-blfs-libyaml, alias: blfs-libyaml }, { origin: ../package-blfs-cryptsetup, alias: blfs-cryptsetup }, { origin: ../package-blfs-keyutils, alias: blfs-keyutils }, { origin: ../package-blfs-libatasmart, alias: blfs-libatasmart }, { origin: ../package-blfs-libbytesize, alias: blfs-libbytesize }, { origin: ../package-blfs-libnvme, alias: blfs-libnvme }, { origin: ../package-blfs-lvm2, alias: blfs-lvm2 }, { origin: ../package-blfs-parted, alias: blfs-parted }]
