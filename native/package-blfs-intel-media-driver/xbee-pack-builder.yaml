schema-version: 1.0
description: Build Intel Media Driver 25.3.4 for modern Intel GPUs.
require: ../../build-system
builder:
  - { origin: ../package-template, alias: tools }
  - { origin: ../blfs-sources, alias: sources }
  - { origin: ../final-system, alias: system }
  - { origin: ../package-blfs-cmake, alias: blfs-cmake }
  - { origin: ../package-blfs-libarchive, alias: blfs-libarchive }
  - { origin: ../package-blfs-libxml2, alias: blfs-libxml2 }
  - { origin: ../package-openssl, alias: openssl }
  - { origin: ../package-zlib, alias: zlib }
  - { origin: ../package-bzip2, alias: bzip2 }
  - { origin: ../package-xz, alias: xz }
  - { origin: ../package-zstd, alias: zstd }
  - { origin: ../package-expat, alias: expat }
  - { origin: ../package-ninja, alias: ninja }
  - { origin: ../package-blfs-gmmlib, alias: blfs-gmmlib }
  - { origin: ../package-blfs-libva, alias: blfs-libva }
  - { origin: ../package-blfs-libdrm, alias: blfs-libdrm }
var:
  xbee: { version: "25.3.4-2" }
  lfs: { jobs: 4 }
  package: { name: intel-media-driver, version: "25.3.4", source: intel-media-driver-25.3.4.tar.gz, runtime-dependencies: "gmmlib,libva,libdrm" }
build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}"
          "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"
