schema-version: 1.0
description: Build libxfce4util 4.20.1 for BLFS.
require: ../../build-system
builder: [{ origin: ../package-template, alias: tools }, { origin: ../blfs-sources, alias: sources }, { origin: ../final-system, alias: system }, { origin: ../package-blfs-glib, alias: blfs-glib }]
var: { xbee: { version: "4.20.1-1" }, lfs: { jobs: 4 }, package: { name: libxfce4util, version: "4.20.1", source: libxfce4util-4.20.1.tar.bz2, runtime-dependencies: "glib" } }
build: [{ shell: { cmd: ['bash "/opt/xbee-lfs-native/build-xbpkg.sh" "/opt/xbee-lfs-native/sources" "/opt/xbee-lfs-native/final-rootfs.tar.zst" "{{ .package.name }}" "{{ .package.version }}" "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}" "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}" "{{ .xbee.resources }}/build.sh"'] } }]
