schema-version: 1.0

description: Build the nghttp2 HTTP/2 library from BLFS 13.0 for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../blfs-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-blfs-libxml2
    alias: blfs-libxml2
  - origin: ../package-pkgconf
    alias: pkgconf

var:
  xbee:
    version: "1.68.0-1"
  lfs:
    jobs: 4
  package:
    name: nghttp2
    version: "1.68.0"
    source: nghttp2-1.68.0.tar.xz
    runtime-dependencies: libxml2

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
          "{{ .xbee.resources }}/build.sh"
