schema-version: 1.0

description: Minimal XBee OS 13.0 system for Docker and VirtualBox.

system:
  container: "{{ .image.container }}:{{ .image.tag }}"
  user: "{{ .xbee.user }}"

var:
  xbee:
    version: "13.0"
    user: xbee
    group: xbee
    app: /workspace
  image:
    container: xbee-os
    tag: "13.0"

user: "{{ .xbee.user }}"
directory: "{{ .xbee.app }}"

provider:
  virtualbox:
    disk: https://github.com/xbeerepository/lfs/releases/download/v0.3.3/xbee-os-13.0-x86_64-virtualbox.vmdk
    ostype: Linux_64
    guest-additions: false
    cloud-init: ""
