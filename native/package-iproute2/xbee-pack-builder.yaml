schema-version: 1.0

description: Build the iproute2 package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-libcap
    alias: libcap
  - origin: ../package-libelf
    alias: libelf

var:
  xbee:
    version: "6.18.0"
  lfs:
    jobs: 4
  package:
    name: iproute2
    version: "6.18.0"
    source: iproute2-6.18.0.tar.xz
    runtime-dependencies: libcap,libelf

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ index .package "runtime-dependencies" }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
