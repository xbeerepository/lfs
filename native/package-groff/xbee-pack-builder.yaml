schema-version: 1.0

description: Build the Groff package for XBee LFS.

require: ../../build-system

builder:
  - origin: ../package-template
    alias: tools
  - origin: ../final-sources
    alias: sources
  - origin: ../final-system
    alias: system
  - origin: ../package-gcc
    alias: gcc
  - origin: ../package-perl
    alias: perl

var:
  xbee:
    version: "1.23.0"
  lfs:
    jobs: 4
  package:
    name: groff
    version: "1.23.0"
    source: groff-1.23.0.tar.gz
    runtime-dependencies: gcc,perl

provision:
  - shell:
      cmd:
        - apt-get update
        - DEBIAN_FRONTEND=noninteractive apt-get install -y tar xz-utils zstd

build:
  - shell:
      cmd:
        - >-
          bash "/opt/xbee-lfs-native/build-xbpkg.sh"
          "/opt/xbee-lfs-native/sources"
          "/opt/xbee-lfs-native/final-rootfs.tar.zst"
          "{{ .package.name }}" "{{ .package.version }}"
          "{{ .package.source }}" "{{ .package.runtime-dependencies }}"
          "{{ .lfs.jobs }}" "{{ .xbee.src }}" "{{ .xbee.out }}"
