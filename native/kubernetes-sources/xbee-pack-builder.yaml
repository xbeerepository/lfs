schema-version: 1.0

description: Download and verify the Kubernetes source tree and node runtime dependencies.

require: ../../build-system

var:
  xbee:
    version: "1.37.0"

build:
  - shell:
      cmd:
        - >-
          bash "{{ .xbee.resources }}/download.sh"
          "{{ .xbee.resources }}/sources.tsv"
          "{{ .xbee.out }}"
